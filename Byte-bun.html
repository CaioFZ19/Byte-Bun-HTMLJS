<!DOCTYPE html>

<html>
    <head>
        <title>Calculadora Byte & Bun</title>
        <link rel="stylesheet" href="css_calculadora.css">
    </head>

    <body>
        <h1>Bem vindo ao Byte & Bun!</h1>
        <h2>Faça seu pedido abaixo escolhendo pão, recheio e molho.</h2>
        
        <section>
            <h3>Selecione seu pão</h3>
            <select name="pao" id="sltPao">
            </select>
        </section>

        <section>
            <h3>Selecione seu recheio</h3>
            <select name="recheio" id="sltRecheio">
            </select>
        </section>

        <section>
            <h3>Selecione seu molho</h3>
            <select name="molho" id="sltMolho">
            </select>
        </section>

        <section>
            <button>Calcular total</button>
            <p id="#cupom"></p>
        </section>

        

        <script src="script_calculadora.js"></script>
    </body>
</html>
